[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenticos-local"
version = "0.3.0"
description = "Local-first personal AI control center"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentos = "agenticos.cli:main"

[tool.setuptools]
packages = ["agenticos"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
